name: Mermaid renderers on Windows

# TASK 137 R11, D13 — the Mermaid renderers on native Windows (MR-1): the pinned browser build,
# the setup, one render of a reference figure, and the tests of the Windows branches. The job
# takes about six minutes, so it runs only when the skill or this file changes.
on:
  push:
    branches:
      - "**"
    paths:
      - ".agent/skills/mermaid-authoring-guidelines/**"
      - ".github/workflows/mermaid-render-windows.yml"
  pull_request:
    paths:
      - ".agent/skills/mermaid-authoring-guidelines/**"
      - ".github/workflows/mermaid-render-windows.yml"

# The job only reads the repository; the token needs no write scope.
permissions:
  contents: read

jobs:
  mermaid-render-windows:
    name: Mermaid renderers on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    # Bash, so that a failed command fails its step, and setup_renderers.sh runs as under Git Bash.
    defaults:
      run:
        shell: bash
    env:
      SKILL: .agent/skills/mermaid-authoring-guidelines
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # Node meets the `engines.node` floor of the check pair (22.13).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The tests use stand-ins and no install; they run first.
      - name: Run the tests of the Windows branches
        run: python -m pytest -p no:cacheprovider "$SKILL/scripts/tests/test_renderers_windows.py" -q -rs

      # The setup installs the current stable chrome-headless-shell with the @puppeteer/browsers
      # of its lockfiles (TASK 137 D16): no build number to keep, no override.
      - name: Install the renderers
        run: bash "$SKILL/scripts/setup_renderers.sh"

      - name: Render a reference figure
        run: python "$SKILL/scripts/render_check.py" "$SKILL/scripts/tests/fixtures/fx-tree.mmd"
