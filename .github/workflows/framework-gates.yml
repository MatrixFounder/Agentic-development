name: Framework Gates

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tooling regression tests
        run: |
          PYTHONPATH=. pytest -p no:cacheprovider tests/test_tool_runner.py tests/test_tool_runner_security_contract.py tests/test_spec_validator.py tests/test_language_independence.py tests/test_inline_efficiency.py tests/test_positional_refs.py tests/test_scratch_hygiene.py .agent/skills/skill-spec-validator/scripts/tests/ -q

  skill-validate:
    name: Skill validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate skills catalog
        run: python System/scripts/validate_skills.py --root . --quiet

  reference-integrity:
    name: Reference integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check prompt references
        run: python System/scripts/check_prompt_references.py --root .

  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static security lint
        run: python System/scripts/security_lint.py --root .

  workflow-smoke:
    name: Workflow smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run workflow smoke checks
        run: python System/scripts/smoke_workflows.py --root .

  loop-contract:
    name: Loop contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML — the one dependency Component B adds (spec S3), pinned in requirements-dev.txt.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Phase 3 is warn-only (S4). Phase 4 adds --strict here and nothing else changes.
      - name: Check workflow loop contracts
        run: python System/scripts/check_loop_contract.py --root .

      # A validator that cannot fail is not a validator. If this fixture ever passes,
      # the step above is asserting nothing and the job must go red.
      - name: R3 negative fixture must FAIL
        run: |
          if python System/scripts/check_loop_contract.py \
               --root tests/fixtures/loop_contract/negative --strict; then
            echo "::error::R3 negative fixture passed the validator — R3 is vacuous"
            exit 1
          fi
