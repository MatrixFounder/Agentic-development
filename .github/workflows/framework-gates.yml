name: Framework Gates

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tooling regression tests
        run: |
          PYTHONPATH=. pytest -p no:cacheprovider tests/test_tool_runner.py tests/test_tool_runner_security_contract.py tests/test_spec_validator.py tests/test_language_independence.py tests/test_inline_efficiency.py tests/test_positional_refs.py tests/test_scratch_hygiene.py tests/test_loop_contract.py .agent/skills/skill-spec-validator/scripts/tests/ .agent/tools/test_task_id_tool.py .agent/tools/test_archive_protocol.py .agent/tools/test_rebase_links.py -q

      # The curated unittest suite. It is NOT covered by the pytest list above:
      # `load_tests` in run_tests.py pulls in the whole of `tests/installer/`
      # plus the product-skill scripts, and none of that ran in CI. Same class
      # as the 86 archive-protocol tests found unrun during ARC-1.
      - name: Run curated unittest suite (incl. installer)
        run: PYTHONPATH=. python tests/run_tests.py

      # The register scanner's own battery. It is not a pytest module, so it
      # has to be named explicitly or it runs only by hand.
      - name: Run artifact-formalizer selftest
        run: python .agent/skills/artifact-formalizer/scripts/selftest_scan.py

      # Instrument health. Findings stay advisory (documentation-standards §4:
      # a gate that fails on correct documents is how gates get switched off).
      # A DEAD DETECTOR is not a finding — it is the scanner reporting a clean
      # document while one of its checks is broken, which is the failure this
      # skill exists to prevent.
      # Exit 2 fails the build; exit 3 means the command below is mistyped and
      # also fails, which is why the two codes are distinct.
      #
      # This step is the DEDICATED detector gate, no longer the only one: TASK
      # 099 pinned the roster at 9 rows per shipped language and applies that
      # pin on the ordinary scan path too, so the advisory step below now exits
      # 2 on a dead detector as well. Before the pin, a vanished detector class
      # shrank the denominator and printed `17/17 detectors live` at exit 0.
      - name: Register scanner — probe every detector
        run: python .agent/skills/artifact-formalizer/scripts/scan_register.py --probe

      # Advisory sweep of the living artifacts. The scanner exits 0 on any
      # number of findings, so this step fails ONLY on a broken instrument.
      # Deliberately no `|| true`: that would swallow the exit-2 signal too.
      #
      # `--allow-missing` because `docs/TASK.md` and `docs/PLAN.md` are ARCHIVED
      # at every task boundary, so their absence is a state this framework
      # produces rather than a fault (TASK 097 D2). Before it, that absence
      # exited 2 and painted the build red under a comment claiming only a dead
      # detector could. A path that is present but unreadable still exits 3, and
      # an input set with nothing readable in it always does — so a mistyped
      # path is still caught here.
      - name: Register scan — living artifacts (advisory)
        run: |
          python .agent/skills/artifact-formalizer/scripts/scan_register.py \
            docs/TASK.md docs/PLAN.md docs/ARCHITECTURE.md \
            --allow-missing --sections --terms docs/ARCHITECTURE.md

  skill-validate:
    name: Skill validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate skills catalog
        run: python System/scripts/validate_skills.py --root . --quiet

  reference-integrity:
    name: Reference integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check prompt references
        run: python System/scripts/check_prompt_references.py --root .

      # documentation-standards §4.1. The checker and its unit tests already existed;
      # nothing ever ran the CHECK itself over a document, so 39 unresolvable references
      # accumulated across docs/ before anyone looked.
      #
      # Whole tree, and deliberately WITHOUT --strict. Errors already exit 1 on their own;
      # --strict additionally promotes DRIFT_SUSPECT, which fires when a reference points
      # into a file the same change edits. `docs/TASK.md` is rewritten by every task, so
      # --strict here would paint a normal pipeline run red for a warning whose own text
      # is "re-check after the edits are final".
      - name: Check positional references (docs/)
        run: |
          python .agent/skills/documentation-standards/scripts/check_positional_refs.py \
            --all docs

  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static security lint
        run: python System/scripts/security_lint.py --root .

  workflow-smoke:
    name: Workflow smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run workflow smoke checks
        run: python System/scripts/smoke_workflows.py --root .

  loop-contract:
    name: Loop contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML — the one dependency Component B adds (spec S3), pinned in requirements-dev.txt.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Phase 3 is warn-only (S4). Phase 4 adds --strict here and nothing else changes.
      - name: Check workflow loop contracts
        run: python System/scripts/check_loop_contract.py --root .

      # A validator that cannot fail is not a validator. If this fixture ever passes,
      # the step above is asserting nothing and the job must go red.
      - name: R3 negative fixture must FAIL
        run: |
          if python System/scripts/check_loop_contract.py \
               --root tests/fixtures/loop_contract/negative --strict; then
            echo "::error::R3 negative fixture passed the validator — R3 is vacuous"
            exit 1
          fi
